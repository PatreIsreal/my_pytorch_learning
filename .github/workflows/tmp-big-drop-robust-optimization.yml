    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve cache keys
        id: params
        shell: bash
        run: |
          echo "week=$(TZ=Asia/Shanghai date +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "bjt_date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .venv/us_intraday_picker
          key: us-intraday-venv-v1-${{ runner.os }}-py312-${{ hashFiles('us_daily_picker/requirements.txt') }}
      - uses: actions/cache@v4
        with:
          path: .cache/us_daily_picker/sec
          key: us-intraday-sec-compact-v1-${{ runner.os }}-${{ steps.params.outputs.week }}
          restore-keys: |
            us-daily-picker-sec-v3-${{ runner.os }}-${{ steps.params.outputs.week }}
      - uses: actions/cache@v4
        with:
          path: .cache/us_intraday_picker/kline
          key: us-intraday-market-v2-${{ runner.os }}-${{ steps.params.outputs.bjt_date }}
          restore-keys: |
            us-intraday-market-v2-${{ runner.os }}-

      - name: Materialize optimizer
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$VENV_DIR/bin/python" ]]; then
            python -m venv "$VENV_DIR"
            "$VENV_DIR/bin/python" -m pip install --disable-pip-version-check -r us_daily_picker/requirements.txt
          fi
          "$VENV_DIR/bin/python" - <<'PYCODE'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = ''.join(os.environ['SCRIPT_B64'].split())
          decoded = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = 'a7435ed68d731fa2f8723b66e132d26e7858dac1b2476e25f2a508bf9010ab5e'
          digest = hashlib.sha256(decoded).hexdigest()
          assert digest == expected, (digest, expected)
          path = Path('research_backtests/big_drop_optimizer.py')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(decoded)
          PYCODE
          "$VENV_DIR/bin/python" -m py_compile research_backtests/big_drop_optimizer.py
          sed -i 's/facts.measurement_date - INTERVAL ? DAY/facts.measurement_date - CAST(? AS INTEGER)/' research_backtests/green_k_top3_3m.py
          sed -i 's/top3 = ranked\[ranked\["activity_rank"\] <= 3\]\.copy()/top3 = ranked.copy()/' research_backtests/green_k_top3_3m.py

      - name: Run robust walk-forward optimization
        shell: bash
        run: |
          set -euo pipefail
          rm -rf big_drop_parameter_optimization
          "$VENV_DIR/bin/python" research_backtests/big_drop_optimizer.py \
            --capital 1000000 \
            --end-date 2026-08-21 \
            --signal-configs 1500 \
            --top-signals 40 \
            --seed 20260825 \
            --cache-dir .cache/us_daily_picker/sec \
            --kline-cache-dir .cache/us_intraday_picker/kline \
            --output-dir big_drop_parameter_optimization \
            | tee big_drop_parameter_optimization_run.log

      - name: Verify results
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" - <<'PYCODE'
          import json
          from pathlib import Path
          p = json.loads(Path('big_drop_parameter_optimization/result.json').read_text())
          assert p['baseline']['periods']['recheck']['executed_batches'] >= 1
          assert p['walk_forward_candidate']['periods']['recheck']['executed_batches'] >= 1
          print(json.dumps({
              'baseline': p['baseline']['periods']['recheck'],
              'walk_forward': p['walk_forward_candidate']['periods']['recheck'],
          }, ensure_ascii=False, indent=2))
          PYCODE

      - name: Upload complete audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robust-big-drop-parameter-optimization
          path: |
            big_drop_parameter_optimization
            big_drop_parameter_optimization_run.log
          if-no-files-found: error
          retention-days: 7
