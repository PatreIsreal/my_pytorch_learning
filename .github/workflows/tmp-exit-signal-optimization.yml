    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb pandas numpy requests pyarrow
      - name: Materialize optimizer and audited signals
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, gzip, os
          def decode(name, path):
              payload = ''.join(os.environ[name].split())
              with open(path, 'wb') as f:
                  f.write(gzip.decompress(base64.b64decode(payload)))
          decode('SCRIPT_B64', 'optimize_exit_signals.py')
          decode('TRADES_B64', 'exit_opt_input_trades.csv')
          PYCODE
          python -m py_compile optimize_exit_signals.py
      - name: Run exit optimization
        shell: bash
        run: |
          set -uo pipefail
          rm -rf exit_optimization_output .tmp_exit_opt_data
          mkdir -p exit_optimization_output
          status=0
          python optimize_exit_signals.py \
            --input-trades exit_opt_input_trades.csv \
            --data-dir .tmp_exit_opt_data \
            --out-dir exit_optimization_output \
            > exit_optimization_output/run.log 2>&1 || status=$?
          printf '\nworkflow_exit_status=%s\n' "$status" >> exit_optimization_output/run.log
          rm -rf .tmp_exit_opt_data
          exit "$status"
      - name: Upload exit optimization output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exit-signal-optimization-results
          path: exit_optimization_output
          if-no-files-found: warn
          retention-days: 2
