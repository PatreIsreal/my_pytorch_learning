name: Temporary validate turnover denominator

on:
  push:
    branches:
      - tmp/accurate-us-float-audit-20260822
    paths:
      - tmp_accurate_backtest/validate_tr_denominator.py
      - .github/workflows/tmp-validate-tr-denominator.yml
  pull_request:
    branches: [main]
    paths:
      - tmp_accurate_backtest/validate_tr_denominator.py
      - .github/workflows/tmp-validate-tr-denominator.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/tmp/accurate-us-float-audit-20260822' || github.head_ref == 'tmp/accurate-us-float-audit-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb pandas numpy requests pyarrow
      - name: Validate denominator
        shell: bash
        run: |
          set -uo pipefail
          rm -rf denominator_validation_output .tmp_denominator_data
          mkdir -p denominator_validation_output
          status=0
          python tmp_accurate_backtest/validate_tr_denominator.py \
            --data-dir .tmp_denominator_data \
            --out-dir denominator_validation_output \
            > denominator_validation_output/run.log 2>&1 || status=$?
          printf '\nworkflow_exit_status=%s\n' "$status" >> denominator_validation_output/run.log
          rm -rf .tmp_denominator_data
          exit "$status"
      - name: Upload denominator audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnover-denominator-validation
          path: denominator_validation_output
          if-no-files-found: warn
          retention-days: 2
