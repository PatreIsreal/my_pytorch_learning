    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve cache keys
        id: params
        shell: bash
        run: |
          echo "week=$(TZ=Asia/Shanghai date +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "bjt_date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore Python environment
        uses: actions/cache@v4
        with:
          path: .venv/us_intraday_picker
          key: us-intraday-venv-v1-${{ runner.os }}-py312-${{ hashFiles('us_daily_picker/requirements.txt') }}

      - name: Restore compact SEC cache
        uses: actions/cache@v4
        with:
          path: .cache/us_daily_picker/sec
          key: us-intraday-sec-compact-v1-${{ runner.os }}-${{ steps.params.outputs.week }}
          restore-keys: |
            us-daily-picker-sec-v3-${{ runner.os }}-${{ steps.params.outputs.week }}

      - name: Restore market cache
        uses: actions/cache@v4
        with:
          path: .cache/us_intraday_picker/kline
          key: us-intraday-market-v2-${{ runner.os }}-${{ steps.params.outputs.bjt_date }}

      - name: Prepare dependencies and optimizer
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$VENV_DIR/bin/python" ]]; then
            python -m venv "$VENV_DIR"
            "$VENV_DIR/bin/python" -m pip install --disable-pip-version-check \
              -r us_daily_picker/requirements.txt
          fi
          "$VENV_DIR/bin/python" - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          payload = ''.join(os.environ['OPTIMIZER_B64'].split())
          Path('optimize_green_k_parameters.py').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          PY
          "$VENV_DIR/bin/python" -m py_compile optimize_green_k_parameters.py
          sed -i 's/facts.measurement_date - INTERVAL ? DAY/facts.measurement_date - CAST(? AS INTEGER)/' \
            research_backtests/green_k_top3_3m.py
          sed -i 's/top3 = ranked\[ranked\["activity_rank"\] <= 3\]\.copy()/top3 = ranked.copy()/' \
            research_backtests/green_k_top3_3m.py

      - name: Run walk-forward parameter search
        shell: bash
        run: |
          set -euo pipefail
          rm -rf green_k_parameter_optimization
          "$VENV_DIR/bin/python" optimize_green_k_parameters.py \
            --capital 1000000 \
            --end-date 2026-08-21 \
            --signal-configs 1200 \
            --top-signal-configs 30 \
            --seed 20260824 \
            --cache-dir .cache/us_daily_picker/sec \
            --kline-cache-dir .cache/us_intraday_picker/kline \
            --output-dir green_k_parameter_optimization \
            | tee green_k_parameter_optimization_run.log

      - name: Verify result package
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('green_k_parameter_optimization/result.json').read_text(encoding='utf-8'))
          baseline = payload['baseline']['test']
          recommended = payload['recommended']['test']
          assert baseline['executed_batches'] >= 1
          assert recommended['executed_batches'] >= 1
          assert payload['search']['signal_configs'] == 1200
          print(json.dumps(payload['test_improvement'], ensure_ascii=False, indent=2))
          print(json.dumps(payload['recommended'], ensure_ascii=False, indent=2))
          PY

      - name: Upload complete optimization audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-k-parameter-optimization
          path: |
            green_k_parameter_optimization
            green_k_parameter_optimization_run.log
          if-no-files-found: error
          retention-days: 7
