name: Temporary green-K parameter optimization fast

on:
  push:
    branches:
      - tmp/green-k-parameter-opt-20260824
    paths:
      - .github/workflows/tmp-green-k-parameter-optimization-fast.yml

permissions:
  contents: write

jobs:
  optimize-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      VENV_DIR: .venv/us_intraday_picker
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve cache keys
        id: params
        shell: bash
        run: |
          echo "week=$(TZ=Asia/Shanghai date +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "bjt_date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .venv/us_intraday_picker
          key: us-intraday-venv-v1-${{ runner.os }}-py312-${{ hashFiles('us_daily_picker/requirements.txt') }}
      - uses: actions/cache@v4
        with:
          path: .cache/us_daily_picker/sec
          key: us-intraday-sec-compact-v1-${{ runner.os }}-${{ steps.params.outputs.week }}
          restore-keys: |
            us-daily-picker-sec-v3-${{ runner.os }}-${{ steps.params.outputs.week }}
      - uses: actions/cache@v4
        with:
          path: .cache/us_intraday_picker/kline
          key: us-intraday-market-v2-${{ runner.os }}-${{ steps.params.outputs.bjt_date }}
          restore-keys: |
            us-intraday-market-v2-${{ runner.os }}-
      - name: Prepare optimizer
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$VENV_DIR/bin/python" ]]; then
            python -m venv "$VENV_DIR"
            "$VENV_DIR/bin/python" -m pip install --disable-pip-version-check -r us_daily_picker/requirements.txt
          fi
          cat research_backtests/optimizer_payload/opt_*.b64 | tr -d '\n\r ' > optimizer_payload.b64
          "$VENV_DIR/bin/python" - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          decoded = gzip.decompress(base64.b64decode(Path('optimizer_payload.b64').read_text(), validate=True))
          digest = hashlib.sha256(decoded).hexdigest()
          expected = 'dfaeb2ac1c4670da76ccf03c82c1b7f08d2d513987eb1f3b541e673dda18f079'
          assert digest == expected, (digest, expected)
          Path('optimize_green_k_parameters.py').write_bytes(decoded)
          PY
          sed -i 's/facts.measurement_date - INTERVAL ? DAY/facts.measurement_date - CAST(? AS INTEGER)/' research_backtests/green_k_top3_3m.py
          sed -i 's/top3 = ranked\[ranked\["activity_rank"\] <= 3\]\.copy()/top3 = ranked.copy()/' research_backtests/green_k_top3_3m.py
      - name: Run fast walk-forward search
        shell: bash
        run: |
          set -euo pipefail
          rm -rf green_k_parameter_optimization_fast
          "$VENV_DIR/bin/python" optimize_green_k_parameters.py \
            --capital 1000000 \
            --end-date 2026-08-21 \
            --signal-configs 300 \
            --top-signal-configs 8 \
            --seed 20260824 \
            --cache-dir .cache/us_daily_picker/sec \
            --kline-cache-dir .cache/us_intraday_picker/kline \
            --output-dir green_k_parameter_optimization_fast \
            | tee green_k_parameter_optimization_fast_run.log
      - name: Verify
        shell: bash
        run: |
          "$VENV_DIR/bin/python" - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('green_k_parameter_optimization_fast/result.json').read_text())
          assert p['baseline']['test']['executed_batches'] >= 1
          assert p['recommended']['test']['executed_batches'] >= 1
          print(json.dumps(p['test_improvement'], indent=2))
          PY
      - name: Commit compact result package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            green_k_parameter_optimization_fast/result.json \
            green_k_parameter_optimization_fast/recommended_config.json \
            green_k_parameter_optimization_fast/report.md \
            green_k_parameter_optimization_fast/test_comparison.csv \
            green_k_parameter_optimization_fast/period_results.csv \
            green_k_parameter_optimization_fast/validation_candidates.csv
          git commit -m "Publish fast green-K parameter optimization" || exit 0
          git pull --rebase origin tmp/green-k-parameter-opt-20260824
          git push origin HEAD:tmp/green-k-parameter-opt-20260824
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-k-parameter-optimization-fast
          path: |
            green_k_parameter_optimization_fast
            green_k_parameter_optimization_fast_run.log
          if-no-files-found: error
          retention-days: 7
