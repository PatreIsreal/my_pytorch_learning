name: US intraday activity TOP3 Beijing

on:
  schedule:
    # Beijing time is UTC+8 year-round.
    - cron: "30 8 * * 1-5"   # 16:30 Beijing
    - cron: "0 13 * * 1-5"   # 21:00 Beijing
  workflow_dispatch:
    inputs:
      force:
        description: "Force a fresh run"
        required: true
        default: true
        type: boolean
      refresh_sec:
        description: "Rebuild the weekly SEC reference cache"
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - "us_intraday_picker/**"
      - ".github/workflows/us-intraday-top3-beijing.yml"
  push:
    branches: [main]
    paths:
      - "us_intraday_picker/**"
      - ".github/workflows/us-intraday-top3-beijing.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: us-intraday-top3-beijing
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: us_daily_picker/requirements.txt

      - name: Resolve run parameters and cache week
        id: params
        shell: bash
        run: |
          set -euo pipefail
          echo "week=$(TZ=Asia/Shanghai date +%G-%V)" >> "$GITHUB_OUTPUT"
          output_dir="intraday_picks_top3"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            output_dir="test_output/intraday_picks_top3"
          fi
          refresh_sec="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            refresh_sec="${{ inputs.refresh_sec }}"
          fi
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "refresh_sec=$refresh_sec" >> "$GITHUB_OUTPUT"

      - name: Restore audited weekly SEC reference cache
        uses: actions/cache@v4
        with:
          path: .cache/us_daily_picker/sec
          key: us-daily-picker-sec-v3-${{ runner.os }}-${{ steps.params.outputs.week }}

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r us_daily_picker/requirements.txt

      - name: Run latest public-snapshot Top 3
        id: picker
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --cache-dir .cache/us_daily_picker/sec
            --work-dir .work/us_intraday_picker
            --output-dir "${{ steps.params.outputs.output_dir }}"
            --force
          )
          if [[ "${{ steps.params.outputs.refresh_sec }}" == "true" ]]; then
            args+=(--refresh-sec)
          fi
          python -m us_intraday_picker.intraday_top3 "${args[@]}"

      - name: Verify ranking audit
        if: steps.picker.outputs.status == 'ready'
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.params.outputs.output_dir }}/latest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = payload.get("ranking") or []
          if len(rows) != 3:
              raise SystemExit(f"Expected exactly three rows, got {len(rows)}")
          ranks = [int(row["activity_rank"]) for row in rows]
          if ranks != [1, 2, 3]:
              raise SystemExit(f"Unexpected ranks: {ranks}")
          activity = [float(row["activity_ratio"]) for row in rows]
          if activity != sorted(activity, reverse=True):
              raise SystemExit(f"Activity is not descending: {activity}")
          for row in rows:
              expected = row.get("change_pct") is not None and float(row["change_pct"]) <= -8.0
              if bool(row["drop_filter_pass"]) != expected:
                  raise SystemExit(f"Drop-filter mismatch for {row['symbol']}")
          print("Verified latest-public-snapshot activity Top 3")
          PY

      - name: Upload run files for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-intraday-top3-${{ steps.picker.outputs.run_key || github.run_id }}
          path: |
            ${{ steps.params.outputs.output_dir }}
            .work/us_intraday_picker/*.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit current ranking
        if: >-
          github.event_name != 'pull_request' &&
          steps.picker.outputs.status == 'ready'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intraday_picks_top3
          if git diff --cached --quiet; then
            echo "No intraday ranking changes to commit."
            exit 0
          fi
          git commit -m "US intraday Top 3: ${{ steps.picker.outputs.run_key }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish GitHub Issue notification
        if: >-
          github.event_name != 'pull_request' &&
          steps.picker.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.picker.outputs.issue_title }}
          BODY_FILE: ${{ steps.picker.outputs.markdown_path }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --body-file "$BODY_FILE" \
            --assignee PatreIsreal
